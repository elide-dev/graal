name: Upstream candidate validation
on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging/upstream-graal-2026-11-08]
permissions:
  contents: read
concurrency:
  group: upstream-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux-amd64-cipool]
    container: docker.io/library/ubuntu:22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MX_PYTHON: python3
      CANDIDATE_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Install build prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential zlib1g-dev git curl ca-certificates python3 python3-pip unzip zip xz-utils file binutils cmake ninja-build patch pkg-config
          git config --global --add safe.directory '*'
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Check out pinned mx
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: graalvm/mx
          ref: ef054fc6eca1d516820bd040efa3c0a0f6ef1899
          persist-credentials: false
          path: mx
      - name: Fetch declared LabsJDK
        working-directory: source
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate-jdks"
          "${GITHUB_WORKSPACE}/mx/mx" --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "${RUNNER_TEMP}/candidate-jdks" --alias "${GITHUB_WORKSPACE}/labsjdk"
          echo "JAVA_HOME=${GITHUB_WORKSPACE}/labsjdk" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/labsjdk/bin" >> "${GITHUB_PATH}"
      - name: Compare baseline and exact head, then run regressions and checkstyle
        working-directory: source
        run: bash ci/upstream-candidate-validate.sh
      - name: Retain exact identities, logs, reproducers and any native bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate-results/
          if-no-files-found: error
          retention-days: 14
