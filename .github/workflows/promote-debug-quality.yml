name: Preview or promote the exact debug quality SDK artifacts
on:
  push:
    branches: [codex/debug-quality-qualification]
    paths: [.github/workflows/promote-debug-quality.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the reviewed exact assets to the existing Maven destination"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Stage and verify the exact reviewed producer files
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stage-debug-quality-release.py stage stage --catalog .github/qualification/debug-quality-producers.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-quality-release-preview
          path: stage/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: debug-quality-release-preview
          path: qualified
      - name: Verify exact bytes and refuse an existing version
        run: python3 source/.github/scripts/stage-debug-quality-release.py verify qualified --require-unpublished
      # Use the existing release workflow's action, secrets and destination.
      - name: Publish to the existing Maven bucket
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff
        with:
          path: qualified/${{ needs.preview.outputs.version }}
          target: gvm-elide/${{ needs.preview.outputs.version }}
          bucket: elide-maven
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify the public bytes against the qualified manifest
        run: python3 source/.github/scripts/stage-debug-quality-release.py verify-remote qualified
