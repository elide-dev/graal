name: Verify final SDK DWARF with the packaged native producer
on:
  workflow_dispatch:
    inputs:
      platform:
        description: One existing Linux SDK platform
        type: choice
        default: linux-amd64
        options: [linux-amd64, linux-arm64]
      retain_recovery:
        description: Retain named accepted/reproduction evidence for 90 days; review before expiry
        type: boolean
        default: false
      source:
        description: Exact source for successful normal Linux SDK builds
        type: string
        required: true
      runs:
        description: Exact JSON map of linux-amd64 and linux-arm64 full SDK run IDs
        type: string
        required: true
concurrency:
  group: symbolication-qualification-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'linux-amd64' && '["linux-amd64"]' || inputs.platform == 'linux-arm64' && '["linux-arm64"]' || '[]') }}
    steps:
      - name: Require explicit exact producer inputs
        env:
          SOURCE: ${{ inputs.source }}
          RUNS: ${{ inputs.runs }}
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['SOURCE'])
          runs = json.loads(os.environ['RUNS'])
          assert set(runs) == {'linux-amd64', 'linux-arm64'}
          assert all(type(run) is int and run > 0 for run in runs.values())
          PY
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install the pinned ELF reader
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r .github/qualification/debug-quality-python.txt
      - name: Verify the exact final producer evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_SDK_SOURCE: ${{ inputs.source }}
          QUALIFICATION_SDK_RUNS: ${{ inputs.runs }}
        run: python3 .github/scripts/qualify-sdk-dwarf.py '${{ matrix.platform }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.retain_recovery && 'recovery' || 'diagnostic' }}-sdk-dwarf-${{ matrix.platform }}
          path: |
            qualified-sdk/verification/
            qualified-sdk/type-files.json
            qualified-sdk/provenance.json
            qualified-sdk/probe/gdb.txt
            qualified-sdk/probe/SHA256SUMS
            qualified-sdk/probe/artifact.json
          retention-days: ${{ inputs.retain_recovery && 90 || 7 }}
          if-no-files-found: error
