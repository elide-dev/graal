name: Assemble unpublished SDK Maven candidate
on:
  push:
    branches: [codex/debug-quality-qualification]
    paths: [.github/workflows/assemble-sdk-candidate.yml]
  workflow_dispatch:
    inputs:
      runs:
        description: "JSON mapping SDK platforms to successful qualification run IDs"
        required: true
        type: string
      source:
        description: "Exact producer source commit shared by all SDK runs"
        required: true
        type: string
      version:
        description: "SDK candidate version"
        required: true
        type: string
permissions:
  contents: read
jobs:
  assemble:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify producer provenance
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          runs=json.loads(os.environ['RUNS'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE'])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-elide\.[0-9]+',os.environ['VERSION'])
          platforms=['linux-amd64','linux-aarch64','macos-aarch64','windows-amd64']
          assert set(runs)==set(platforms)
          artifacts={}
          for platform in platforms:
              run=runs[platform]
              assert type(run) is int and run>0
              request=urllib.request.Request(f'https://api.github.com/repos/elide-dev/graal/actions/runs/{run}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request) as response: metadata=json.load(response)
              assert metadata['head_sha']==os.environ['SOURCE'] and metadata['conclusion']=='success',metadata['html_url']
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'{platform}={run}\n')
              request=urllib.request.Request(f'https://api.github.com/repos/elide-dev/graal/actions/runs/{run}/artifacts?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request) as response: available=json.load(response)['artifacts']
              names={'natives':'natives-'+platform}
              if platform=='linux-amd64': names['maven']='maven'
              artifacts[platform]={}
              for kind,name in names.items():
                  matches=[artifact for artifact in available if artifact['name']==name and not artifact['expired']]
                  assert matches,name
                  selected=max(matches,key=lambda artifact:artifact['id'])
                  artifacts[platform][kind]=selected['id']
                  with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'{platform.replace("-","_")}_{kind}={selected["id"]}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('artifacts='+json.dumps(artifacts)+'\n')
          PY
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.runs.outputs.linux-amd64 }}
          artifact-ids: ${{ steps.runs.outputs.linux_amd64_maven }}
          github-token: ${{ github.token }}
          path: candidate/repository
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.runs.outputs.linux-amd64 }}
          artifact-ids: ${{ steps.runs.outputs.linux_amd64_natives }}
          github-token: ${{ github.token }}
          path: candidate/natives/linux-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.runs.outputs.linux-aarch64 }}
          artifact-ids: ${{ steps.runs.outputs.linux_aarch64_natives }}
          github-token: ${{ github.token }}
          path: candidate/natives/linux-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.runs.outputs.macos-aarch64 }}
          artifact-ids: ${{ steps.runs.outputs.macos_aarch64_natives }}
          github-token: ${{ github.token }}
          path: candidate/natives/macos-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.runs.outputs.windows-amd64 }}
          artifact-ids: ${{ steps.runs.outputs.windows_amd64_natives }}
          github-token: ${{ github.token }}
          path: candidate/natives/windows-amd64
      - name: Assemble with the normal release packager
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.source }}
          RUNS: ${{ inputs.runs }}
          ARTIFACTS: ${{ steps.runs.outputs.artifacts }}
        run: |
          python3 ci/elide/natives.py merge candidate/repository "$VERSION" candidate/natives/*
          python3 ci/elide/check-maven-closure.py candidate/repository
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('candidate/repository')
          files={p.relative_to(root).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert files
          manifest=Path('candidate/manifest.json')
          manifest.write_text(json.dumps({'source':os.environ['SOURCE'],'version':os.environ['VERSION'],'runs':json.loads(os.environ['RUNS']),'artifacts':json.loads(os.environ['ARTIFACTS']),'files':files},indent=2)+'\n')
          print('Maven candidate manifest SHA256:',hashlib.file_digest(manifest.open('rb'),'sha256').hexdigest())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maven-debug-quality
          path: |
            candidate/manifest.json
            candidate/repository
          compression-level: 0
          if-no-files-found: error
