name: Darwin DWARF diagnostic overlay
on:
  push:
    branches: [codex/debug-quality-qualification]
    paths: [.github/workflows/debug-quality-macos-overlay.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE: 99f8a6e9bbe7cc7fad59f886be5d2220e83687db
      SDK_SOURCE: bcd8a6d9abbd91f19f4ba688ad3bfa1049d70cd4
      SDK_RUN: '41935403545'
      VERSION: 25.5.5-elide.25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE }}
          path: graal
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: graalvm/mx
          ref: '7.88.0'
          path: mx
          persist-credentials: false
      - name: Record diagnostic provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/elide-dev/graal/actions/runs/$SDK_RUN" --jq .head_sha)" = "$SDK_SOURCE"
          mkdir -p evidence
          printf 'Diagnostic OBJECTFILE overlay only; full normal SDK qualification is separate.\nSource: %s\nBase SDK: %s, run %s\n' "$SOURCE" "$SDK_SOURCE" "$SDK_RUN" > evidence/provenance.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ env.SDK_RUN }}
          name: dist-macos-aarch64
          github-token: ${{ github.token }}
          path: sdk-archive
      - name: Verify and extract retained SDK
        run: |
          cd sdk-archive
          shasum -a 256 -c "graalvm-ee-$VERSION-macos-aarch64.tar.gz.sha256"
          mkdir -p ../sdk
          tar -xzf "graalvm-ee-$VERSION-macos-aarch64.tar.gz" -C ../sdk
      - name: Build the normal OBJECTFILE distribution
        run: |
          mkdir -p "$RUNNER_TEMP/jdks"
          cd graal
          ../mx/mx --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "$RUNNER_TEMP/jdks" --alias "$GITHUB_WORKSPACE/labsjdk"
          java_home="$GITHUB_WORKSPACE/labsjdk/Contents/Home"
          ../mx/mx --java-home "$java_home" -p substratevm build --build-logs=silent --dependencies OBJECTFILE
          sdk="$GITHUB_WORKSPACE/sdk/graalvm-ee-$VERSION-macos-aarch64/Contents/Home"
          cp "$sdk/lib/svm/builder/objectfile.jar" "$GITHUB_WORKSPACE/evidence/objectfile.before.jar"
          cp substratevm/mxbuild/jdk25/dists/jdk21/objectfile.jar "$sdk/lib/svm/builder/objectfile.jar"
          shasum -a 256 "$sdk/lib/svm/builder/objectfile.jar" "$GITHUB_WORKSPACE/evidence/objectfile.before.jar" > "$GITHUB_WORKSPACE/evidence/objectfile-sha256.txt"
      - name: Exercise the Darwin producer and debugger
        run: |
          graal/ci/elide/debug-quality-macos.sh "$GITHUB_WORKSPACE/sdk/graalvm-ee-$VERSION-macos-aarch64/Contents/Home" evidence/probes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-dwarf-diagnostic
          path: evidence/
          if-no-files-found: error
