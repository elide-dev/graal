name: Qualify large debug object file offsets
on:
  push:
    branches: [codex/debug-quality-large-objects]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objectfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: graal
          persist-credentials: false
      - name: Use the normal pinned mx and LabsJDK
        run: |
          echo "MX_VERSION=$(python3 -c 'import json; print(json.load(open("graal/common.json"))["mx_version"])')" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GITHUB_WORKSPACE/labsjdk" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: mx
          persist-credentials: false
      - name: Fetch the pinned LabsJDK
        working-directory: graal
        run: ../mx/mx --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "$RUNNER_TEMP/jdks" --alias "$JAVA_HOME"
      - name: Build the object file suite
        working-directory: graal
        run: ../mx/mx --java-home "$JAVA_HOME" -p substratevm build --build-logs=silent --dependencies OBJECTFILE
      - name: Build the hosted regression suite
        working-directory: graal
        run: ../mx/mx --java-home "$JAVA_HOME" -p substratevm build --build-logs=silent
      - name: Run object and debug information regressions
        working-directory: graal
        run: ../mx/mx --java-home "$JAVA_HOME" -p substratevm unittest ObjectFileLargeOffsetTest MachODwarfCodeAddressTest
      - name: Check source formatting
        working-directory: graal
        run: ../mx/mx --java-home "$JAVA_HOME" -p substratevm checkstyle
