#
# Builds Elide's GraalVM fork for every platform Elide ships, and publishes the release to
# https://maven.elide.dev/gvm-elide/<version>: the Maven artifacts, and two GraalVM distributions per
# platform under dist/. graalvm-ce-* is the fork built from source. graalvm-ee-* is Oracle GraalVM
# (the early-access build from the fork's upstream base, ORACLE_EE_TAG) with the fork's code in place
# of Oracle's open-source code, for the enterprise features: G1, PGO, code compression, ...
#
# Triggers:
#   - Push a tag `gvm-elide-<version>`, e.g. `gvm-elide-25.5.5-elide.1`, to build and publish.
#     A tag ending in `-dryrun` builds and smoke-tests only.
#   - Manual dispatch (once this file is on the default branch).
#
# The jobs run on self-hosted runners, so no pull request event triggers this workflow.
#
name: Elide GraalVM release

on:
  push:
    tags:
      - "gvm-elide-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 25.5.5-elide.1"
        required: true
        type: string
      publish:
        description: "Publish to maven.elide.dev"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: elide-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRAALJS_REPOSITORY: elide-dev/graaljs
  GRAALJS_REF: elide-25.5.x
  GRAALPYTHON_REPOSITORY: elide-dev/graalpython
  GRAALPYTHON_REF: elide-25.5.x
  R2_BUCKET: elide-maven
  R2_ROOT: gvm-elide
  PUBLIC_BASE: https://maven.elide.dev/gvm-elide
  # The distribution is a JDK with Native Image, shaped like Oracle GraalVM's: the SDK's Native
  # Image modules, the Truffle compiler and libgraal, but no polyglot or Truffle API modules and
  # no languages, which ship as Maven artifacts. ni-ce alone would include every component, and
  # no libgraal, so the JVM would compile with jargraal. niwasm (from /web-image) is the WebImage
  # backend at lib/svm/tools/svm-wasm.
  DIST_IMPORTS: /web-image
  DIST_COMPONENTS: cmp,lg,ni,nic,nil,sdkni,svm,svmt,svmsl,tflc,tflsm,niwasm
  DIST_NATIVE_IMAGES: lib:jvmcicompiler,native-image,lib:native-image-agent,lib:native-image-diagnostics-agent
  # The languages build: the Maven artifacts and each platform's natives.
  LANGUAGE_IMPORTS: /graal-js,/graalpython,/wasm
  NATIVES_DISTS: TRUFFLE_API,TRUFFLE_NFI_LIBFFI,GRAALPYTHON_RESOURCES
  # The oldest glibc the Linux distribution and the images it builds must run on. The Linux legs
  # build in a container with this glibc: compiled on a newer one, SVM's C libraries and the images
  # linking them need GLIBC_2.38 (glibc's C23 __isoc23_* redirects). ci/elide/check-glibc.sh checks
  # the distribution and a smoke-test image against it. The build image is set per platform in the
  # build job's matrix (container).
  GLIBC_FLOOR: "2.35"
  # The LLVM major that SVM's static C libraries carry ThinLTO bitcode for on Linux (fat LTO objects,
  # see SVM_LTO_CC in mx_substratevm.py). Embedders link them with this LLVM's lld, and LLVM cannot
  # read bitcode from a newer major, so this must not be newer than theirs. The Linux legs install it
  # from apt.llvm.org's per-major repository for the container's Ubuntu release.
  LTO_LLVM_MAJOR: "23"
  # The Oracle GraalVM build the EE distribution is made from (ci/elide/build-ee.py). It must be
  # built from the fork's upstream base: same GraalVM version and JVMCI, which build-ee.py checks.
  # Update it when the fork moves to a new upstream base.
  ORACLE_EE_REPOSITORY: graalvm/oracle-graalvm-ea-builds
  ORACLE_EE_TAG: jdk-25i5-25.0.4.1.1-ea.03

jobs:
  meta:
    name: Release metadata
    runs-on: linux-amd64-cipool
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - id: meta
        name: Determine version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=${GITHUB_REF_NAME#gvm-elide-}
            publish=true
            if [[ "${version}" == *-dryrun ]]; then
              version=${version%-dryrun}
              publish=false
            fi
          else
            version=${INPUT_VERSION}
            publish=${INPUT_PUBLISH}
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-elide\.[0-9]+$ ]]; then
            echo "::error::invalid release version '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "Release ${version}, publish=${publish}" >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # The Linux legs build in an old-glibc container (see GLIBC_FLOOR); the others on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: linux-amd64-cipool
            container: docker.io/library/ubuntu:22.04
            maven: true
          - platform: linux-aarch64
            runner: linux-arm64-cipool
            container: docker.io/library/ubuntu:22.04
          - platform: macos-aarch64
            runner: macos-arm64-cipool
          - platform: windows-amd64
            runner: windows-amd64-cipool
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools (Linux container)
        if: matrix.container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential zlib1g-dev git curl ca-certificates \
            python3 unzip zip xz-utils file binutils cmake ninja-build patch pkg-config gnupg lsb-release
          # Clang, llvm-ar and lld of LTO_LLVM_MAJOR for the static C libraries' ThinLTO bitcode.
          codename=$(lsb_release -cs)
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LTO_LLVM_MAJOR} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update -q
          apt-get install -y -q --no-install-recommends "clang-${LTO_LLVM_MAJOR}" "llvm-${LTO_LLVM_MAJOR}" "lld-${LTO_LLVM_MAJOR}"
          "/usr/lib/llvm-${LTO_LLVM_MAJOR}/bin/clang" --version
          # The workspace belongs to the runner's user, not root.
          git config --global --add safe.directory '*'
          getconf GNU_LIBC_VERSION
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout graal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: graal
      - name: Checkout graaljs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.GRAALJS_REPOSITORY }}
          ref: ${{ env.GRAALJS_REF }}
          path: graaljs
      - name: Checkout graalpython
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.GRAALPYTHON_REPOSITORY }}
          ref: ${{ env.GRAALPYTHON_REF }}
          path: graalpython
      # The runners are persistent, and a previous run's clean up may not have run: its archives and
      # natives would otherwise ship with this release.
      - name: Remove previous output
        run: rm -rf out smoke smoke-ee smoke-ee-js build-dist.out build-ee.out graalvm-home.txt "${RUNNER_TEMP}"/graalvm-ee-*
      - name: Check free disk space
        run: |
          # Checked after the checkouts, whose git clean removes a previous run's build output.
          # A GraalVM build with GraalJS, GraalPy and GraalWasm needs about 30 GB of work space.
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          echo "free: $((avail_kb / 1024 / 1024)) GB on $(df -Pk . | awk 'NR==2 {print $1}') (runner ${RUNNER_NAME})"
          if [ "${avail_kb}" -lt $((30 * 1024 * 1024)) ]; then
            echo "::error::runner ${RUNNER_NAME} has less than 30 GB free"
            exit 1
          fi
      # mx needs Python 3.8+. The self-hosted runners come with one; setup-python installs into
      # hosted-runner paths (e.g. /Users/runner on macOS), so it is only a fallback.
      - name: Check Python
        id: python
        run: |
          for py in python3 python; do
            if command -v "${py}" >/dev/null 2>&1 && "${py}" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)'; then
              echo "found=true" >> "${GITHUB_OUTPUT}"
              "${py}" --version
              exit 0
            fi
          done
          echo "found=false" >> "${GITHUB_OUTPUT}"
      - name: Set up Python
        if: steps.python.outputs.found != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Record source revisions
        run: |
          for r in graal graaljs graalpython; do
            echo "${r}: $(git -C "${r}" rev-parse HEAD)" | tee -a "${GITHUB_STEP_SUMMARY}"
          done
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          echo "MX_VERSION=$(${py} -c "import json; print(json.load(open('graal/common.json'))['mx_version'])")" >> "${GITHUB_ENV}"
      - name: Checkout mx
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: graalvm/mx
          ref: ${{ env.MX_VERSION }}
          path: mx
      - name: Set up environment
        run: |
          ws=$(pwd)
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ws=$(cygpath -m "${ws}")
            echo "MX=${ws}/mx/mx.cmd" >> "${GITHUB_ENV}"
            echo "MX_PYTHON=python" >> "${GITHUB_ENV}"
          else
            echo "MX=${ws}/mx/mx" >> "${GITHUB_ENV}"
            echo "MX_PYTHON=python3" >> "${GITHUB_ENV}"
          fi
          echo "WS=${ws}" >> "${GITHUB_ENV}"
          echo "JAVA_HOME=${ws}/labsjdk" >> "${GITHUB_ENV}"
          echo "MX_GIT_CACHE=refcache" >> "${GITHUB_ENV}"
          # A UTF-8 locale, so the JDK writes non-ASCII class file names (svm tests have some).
          # The self-hosted Linux runners lack en_US.UTF-8; C.UTF-8 is built into glibc.
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "LANG=C.UTF-8" >> "${GITHUB_ENV}"
            echo "LC_ALL=C.UTF-8" >> "${GITHUB_ENV}"
            # Build SVM's static C libraries as fat LTO objects (see LTO_LLVM_MAJOR).
            echo "SVM_LTO_CC=/usr/lib/llvm-${LTO_LLVM_MAJOR}/bin/clang" >> "${GITHUB_ENV}"
          else
            echo "LANG=en_US.UTF-8" >> "${GITHUB_ENV}"
          fi
      - name: Fetch LabsJDK
        working-directory: graal
        run: |
          mkdir -p "${RUNNER_TEMP}/jdks"
          "${WS}/mx/mx" --java-home= fetch-jdk --jdk-id labsjdk-ce-latest --to "${RUNNER_TEMP}/jdks" --alias "${JAVA_HOME}"
          # On macOS, the JDK is a bundle whose home is Contents/Home.
          if [ -d "${JAVA_HOME}/Contents/Home" ]; then
            JAVA_HOME="${JAVA_HOME}/Contents/Home"
            echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          fi
          "${JAVA_HOME}/bin/java" -version

      - name: Build GraalVM (Unix)
        if: runner.os != 'Windows'
        run: ./graal/ci/elide/build-dist.sh "${VERSION}" "${PLATFORM}" "${WS}/out/dist" | tee build-dist.out
      - name: Build GraalVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          $mxArgs = "--java-home `"$env:JAVA_HOME`" --env ni-ce --dynamicimports $env:DIST_IMPORTS --components=$env:DIST_COMPONENTS --native-images=$env:DIST_NATIVE_IMAGES --non-rebuildable-images=lib:jvmcicompiler"
          cmd /c "call `"$vcvars`" x64 && cd graal\vm && `"$env:MX`" $mxArgs build && `"$env:MX`" $mxArgs graalvm-home > ..\..\graalvm-home.txt"
          if ($LASTEXITCODE -ne 0) { throw "mx build failed ($LASTEXITCODE)" }
          $gvmHome = (Get-Content graalvm-home.txt | Select-Object -Last 1).Trim()
          "GVM_HOME=$gvmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package GraalVM (Windows)
        if: runner.os == 'Windows'
        run: ./graal/ci/elide/build-dist.sh "${VERSION}" "${PLATFORM}" "${WS}/out/dist" --package-only | tee build-dist.out

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          home=$(grep '^home=' build-dist.out | cut -d= -f2-)
          "${home}/bin/java" --version
          # The JVM compiles with libgraal, as Oracle GraalVM's does, not jargraal.
          "${home}/bin/java" -XX:+PrintFlagsFinal -version | grep -E 'UseJVMCINativeLibrary +=.* true'
          "${home}/bin/native-image" --version
          mkdir -p smoke && cd smoke
          printf 'public class Hello { public static void main(String[] a) { System.out.println("hello from " + System.getProperty("java.vendor.version")); } }\n' > Hello.java
          "${home}/bin/javac" Hello.java
          "${home}/bin/native-image" -cp . Hello hello
          ./hello
          ls -la "${WS}/out/dist"
      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          home=$(grep '^home=' build-dist.out | cut -d= -f2-)
          ./graal/ci/elide/check-glibc.sh "${GLIBC_FLOOR}" "${home}" smoke/hello
      - name: Check ThinLTO bitcode of the static C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          home=$(grep '^home=' build-dist.out | cut -d= -f2-)
          ./graal/ci/elide/check-lto.sh "/usr/lib/llvm-${LTO_LLVM_MAJOR}/bin" "${LTO_LLVM_MAJOR}" "${home}" lto-check
      - name: Build EE distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          home=$(grep '^home=' build-dist.out | cut -d= -f2-)
          python3 graal/ci/elide/build-ee.py "${VERSION}" "${PLATFORM}" "${home}" "${WS}/out/dist" | tee build-ee.out
      - name: Smoke test EE (Unix)
        if: runner.os != 'Windows'
        run: |
          home=$(grep '^home=' build-ee.out | cut -d= -f2-)
          ./graal/ci/elide/smoke-ee.sh "${home}" "${PLATFORM}" smoke-ee
      - name: Check glibc floor EE (Linux)
        if: runner.os == 'Linux'
        run: |
          home=$(grep '^home=' build-ee.out | cut -d= -f2-)
          ./graal/ci/elide/check-glibc.sh "${GLIBC_FLOOR}" "${home}" smoke-ee/smoke-plain smoke-ee/smoke-g1
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gvmHome = $env:GVM_HOME -replace '/', '\'
          & "$gvmHome\bin\java.exe" --version
          # The JVM compiles with libgraal, as Oracle GraalVM's does, not jargraal.
          $flags = & "$gvmHome\bin\java.exe" -XX:+PrintFlagsFinal -version | Select-String 'UseJVMCINativeLibrary +=.* true'
          if (-not $flags) { throw "the JVM does not use libgraal" }
          New-Item -ItemType Directory -Force smoke | Out-Null
          Set-Location smoke
          'public class Hello { public static void main(String[] a) { System.out.println("hello from " + System.getProperty("java.vendor.version")); } }' | Out-File -Encoding ascii Hello.java
          & "$gvmHome\bin\javac.exe" Hello.java
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "call `"$vcvars`" x64 && `"$gvmHome\bin\native-image.cmd`" --version && `"$gvmHome\bin\native-image.cmd`" -cp . Hello hello"
          if ($LASTEXITCODE -ne 0) { throw "native-image failed ($LASTEXITCODE)" }
          & .\hello.exe
          if ($LASTEXITCODE -ne 0) { throw "hello.exe failed ($LASTEXITCODE)" }
          Get-ChildItem "$env:WS\out\dist"
      - name: Build EE distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python graal\ci\elide\build-ee.py $env:VERSION $env:PLATFORM $env:GVM_HOME "$env:WS/out/dist" | Tee-Object -FilePath build-ee.out
          if ($LASTEXITCODE -ne 0) { throw "building the EE distribution failed ($LASTEXITCODE)" }
      - name: Smoke test EE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $eeHome = ((Get-Content build-ee.out | Select-String '^home=' | Select-Object -Last 1).Line -replace '^home=', '') -replace '/', '\'
          & "$eeHome\bin\java.exe" --version
          New-Item -ItemType Directory -Force smoke-ee | Out-Null
          Set-Location smoke-ee
          'public class Hello { public static void main(String[] a) { System.out.println("hello from " + System.getProperty("java.vendor.version")); } }' | Out-File -Encoding ascii Hello.java
          & "$eeHome\bin\javac.exe" Hello.java
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          $ni = "`"$eeHome\bin\native-image.cmd`""
          # PGO: an instrumented image writes default.iprof, the optimized build uses it.
          cmd /c "call `"$vcvars`" x64 && $ni --version && $ni -cp . --pgo-instrument Hello hello-instrumented && hello-instrumented.exe && $ni -cp . --pgo=default.iprof Hello hello-pgo && hello-pgo.exe"
          if ($LASTEXITCODE -ne 0) { throw "EE smoke test failed ($LASTEXITCODE)" }

      # The Maven platform builds everything, for maven-deploy; the others, only what the natives
      # come from.
      - name: Build languages (Unix)
        if: runner.os != 'Windows'
        env:
          MAVEN: ${{ matrix.maven }}
        run: |
          cd graal/vm
          mx_args=(--java-home "${JAVA_HOME}" --env ni-ce --dynamicimports "${LANGUAGE_IMPORTS}")
          if [ "${MAVEN}" = true ]; then
            "${MX}" "${mx_args[@]}" build
          else
            "${MX}" "${mx_args[@]}" build --dependencies "${NATIVES_DISTS}"
          fi
      - name: Build languages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          $mxArgs = "--java-home `"$env:JAVA_HOME`" --env ni-ce --dynamicimports $env:LANGUAGE_IMPORTS"
          cmd /c "call `"$vcvars`" x64 && cd graal\vm && `"$env:MX`" $mxArgs build --dependencies $env:NATIVES_DISTS"
          if ($LASTEXITCODE -ne 0) { throw "mx build failed ($LASTEXITCODE)" }

      - name: Collect natives (Unix)
        if: runner.os != 'Windows'
        run: |
          # This platform's native resources, which the publish job merges into the Maven jars.
          cd graal/vm
          mx_args=(--java-home "${JAVA_HOME}" --env ni-ce --dynamicimports "${LANGUAGE_IMPORTS}")
          jars=()
          for spec in truffle-api=TRUFFLE_API truffle-nfi-libffi=TRUFFLE_NFI_LIBFFI python-resources=GRAALPYTHON_RESOURCES; do
            jars+=("${spec%%=*}=$("${MX}" "${mx_args[@]}" paths "${spec#*=}" | tail -1)")
          done
          python3 ../ci/elide/natives.py collect "${PLATFORM}" "${WS}/out/natives" "${jars[@]}"
      - name: Collect natives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location graal\vm
          $mxArgs = @('--java-home', $env:JAVA_HOME, '--env', 'ni-ce', '--dynamicimports', $env:LANGUAGE_IMPORTS)
          $jars = @()
          foreach ($spec in 'truffle-api=TRUFFLE_API', 'truffle-nfi-libffi=TRUFFLE_NFI_LIBFFI', 'python-resources=GRAALPYTHON_RESOURCES') {
            $artifact, $dist = $spec -split '=', 2
            $path = (& $env:MX @mxArgs paths $dist | Select-Object -Last 1).Trim()
            if ($LASTEXITCODE -ne 0) { throw "mx paths $dist failed" }
            $jars += "$artifact=$path"
          }
          python ..\ci\elide\natives.py collect $env:PLATFORM "$env:WS/out/natives" @jars
          if ($LASTEXITCODE -ne 0) { throw "collecting natives failed" }
      - name: Upload natives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: natives-${{ matrix.platform }}
          path: out/natives
          if-no-files-found: error
          retention-days: 7
      - name: Set up Maven
        if: matrix.maven
        env:
          MAVEN_VERSION: 3.9.11
        run: |
          # mx maven-deploy runs mvn, which the runners do not have.
          if ! command -v mvn >/dev/null 2>&1; then
            base="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            curl -sSfL -o "${RUNNER_TEMP}/maven.tar.gz" "${base}"
            echo "$(curl -sSfL "${base}.sha512" | cut -d' ' -f1)  ${RUNNER_TEMP}/maven.tar.gz" | sha512sum -c -
            tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/maven.tar.gz"
            echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"
          fi
      - name: Deploy Maven artifacts
        if: matrix.maven
        run: ./graal/ci/elide/deploy-maven.sh "${VERSION}" "${WS}/out/maven"
      - name: Smoke test EE with GraalJS
        if: matrix.maven
        run: |
          # Truffle runtime compilation on the EE distribution, with the release's own Maven jars.
          home=$(grep '^home=' build-ee.out | cut -d= -f2-)
          ./graal/ci/elide/smoke-ee.sh "${home}" "${PLATFORM}" smoke-ee-js "${WS}/out/maven" "${VERSION}"

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: out/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload Maven repository
        if: matrix.maven
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maven
          path: out/maven
          if-no-files-found: error
          retention-days: 7

      # The runners are persistent: remove this run's checkouts, build output and JDK, which
      # take tens of GB, so they do not fill the runner for other jobs.
      - name: Clean up
        if: always()
        run: |
          rm -rf graal graaljs graalpython mx out smoke smoke-ee smoke-ee-js labsjdk build-dist.out build-ee.out graalvm-home.txt "${RUNNER_TEMP}/jdks" "${RUNNER_TEMP}/maven.tar.gz" "${RUNNER_TEMP}"/apache-maven-* "${RUNNER_TEMP}"/graalvm-ee-*
          df -Pk . | awk 'NR==2 {printf "free after cleanup: %d GB\n", $4 / 1024 / 1024}'

  publish:
    name: Assemble and publish
    needs: [meta, build]
    runs-on: linux-amd64-cipool
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: graal-src
          sparse-checkout: ci/elide
      - name: Link the release scripts
        shell: bash
        run: ln -s graal-src/ci/elide graal-ci
      - name: Refuse to overwrite a published version
        if: needs.meta.outputs.publish == 'true'
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_BASE}/${VERSION}/org/graalvm/polyglot/polyglot/${VERSION}/polyglot-${VERSION}.pom")
          if [ "${code}" = "200" ]; then
            echo "::error::${VERSION} is already published; versions are immutable, pick a new one"
            exit 1
          fi
      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: maven
          path: stage/${{ env.VERSION }}
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: stage/${{ env.VERSION }}/dist
      - name: Download natives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: natives-*
          path: natives
      - name: Merge natives into the Maven jars
        shell: bash
        run: |
          # Each jar gets every platform's native resources; fails if one is missing.
          python3 graal-ci/natives.py merge "stage/${VERSION}" "${VERSION}" natives/natives-*
      - name: List release contents
        shell: bash
        run: |
          ls -la "stage/${VERSION}/dist"
          echo "$(find "stage/${VERSION}" -name '*.pom' | wc -l) Maven artifacts" | tee -a "${GITHUB_STEP_SUMMARY}"
          # A CE and an EE distribution per platform.
          [ "$(ls stage/${VERSION}/dist/graalvm-ce-*.sha256 | wc -l)" = "4" ] || { echo "::error::expected 4 CE distributions"; exit 1; }
          [ "$(ls stage/${VERSION}/dist/graalvm-ee-*.sha256 | wc -l)" = "4" ] || { echo "::error::expected 4 EE distributions"; exit 1; }
      - name: Upload to R2
        if: needs.meta.outputs.publish == 'true'
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff  # main
        with:
          path: stage/${{ env.VERSION }}
          target: ${{ env.R2_ROOT }}/${{ env.VERSION }}
          bucket: ${{ env.R2_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify the published release
        if: needs.meta.outputs.publish == 'true'
        shell: bash
        run: |
          cd "stage/${VERSION}/dist"
          for f in *.sha256; do
            remote=$(curl -sSfL "${PUBLIC_BASE}/${VERSION}/dist/${f}" | cut -d' ' -f1)
            local=$(cut -d' ' -f1 "${f}")
            [ "${remote}" = "${local}" ] || { echo "::error::${f}: published ${remote}, built ${local}"; exit 1; }
            echo "${PUBLIC_BASE}/${VERSION}/dist/${f%.sha256}" | tee -a "${GITHUB_STEP_SUMMARY}"
          done
